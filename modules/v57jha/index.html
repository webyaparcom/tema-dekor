<!-- module-tanitim-3: corporate intro module (image + text blocks) -->
<div class="mt3-wrap">
  <!-- Hero banner -->
  <div class="mt3-hero">
    <img
      src="/img/{{id}}/{{img}}?v={{random}}"
      class="mt3-hero-img"
      alt="{{title}}"
    />
    <div class="mt3-hero-overlay"></div>
  </div>
  <!-- Content area -->
  <div class="mt3-body">
    <div class="mt3-container">
      <h2 class="mt3-heading">{{name}}</h2>
      <p class="mt3-lead">{{description}}</p>
      <div class="mt3-blocks">
        <div class="mt3-block">
          <span class="mt3-block-head">{{name2}}</span>
          <p class="mt3-block-p">{{spot2}}</p>
        </div>
        <div class="mt3-block">
          <span class="mt3-block-head">{{name3}}</span>
          <p class="mt3-block-p">{{spot3}}</p>
        </div>
      </div>
    </div>
  </div>
</div>
<style>
  .mt3-wrap {
    background-color: --bgcolor--;
    color: --fontcolor--;
    margin: --margintop--px 0 --marginbotton--px 0;
    width: 100%;
    float: left;
  }

  /* Banner: container dışına taşan tam genişlik görsel */
  .mt3-hero {
    position: relative;
    width: 100vw;
    left: 50%;
    right: 50%;
    margin-left: -50vw;
    margin-right: -50vw;
    height: 340px;
    overflow: hidden;
  }

  .mt3-hero-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .mt3-hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, transparent 40%, --bgcolor-- 100%);
    pointer-events: none;
  }

  /* Metin alanı: ortalanmış, negatif margin ile banner’a yaklaşan kutu */
  .mt3-body {
    margin-top: -80px;
    position: relative;
    z-index: 1;
    padding-bottom: 2.5rem;
  }

  .mt3-container {
    width: var(--max);
    max-width: 100%;
    margin: 0 auto;
    padding: 0 1.5rem;
    box-sizing: border-box;
  }

  .mt3-heading {
    font-size: 2rem;
    font-weight: 800;
    line-height: 1.2;
    margin: 0 0 1rem 0;
    text-align: center;
  }

  .mt3-lead {
    font-size: 1rem;
    line-height: 1.65;
    margin: 0 auto 2rem auto;
    max-width: 640px;
    text-align: center;
    opacity: 0.92;
  }

  /* Vizyon / Misyon: sol border vurgulu, yan yana */
  .mt3-blocks {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
  }

  .mt3-block {
    padding: 1.25rem 1.25rem 1.25rem 1.5rem;
    border-left: 4px solid --fontcolor--;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 0 10px 10px 0;
  }

  .mt3-block-head {
    display: block;
    font-size: 1rem;
    font-weight: 700;
    margin-bottom: 0.35rem;
  }

  .mt3-block-p {
    font-size: 0.875rem;
    line-height: 1.55;
    margin: 0;
    opacity: 0.9;
  }

  @media screen and (max-width: 1024px) {
    .mt3-hero {
      height: 260px;
    }

    .mt3-body {
      margin-top: -60px;
    }

    .mt3-blocks {
      grid-template-columns: 1fr;
    }
  }

  @media screen and (max-width: 600px) {
    .mt3-hero {
      height: 200px;
    }

    .mt3-heading {
      font-size: 1.5rem;
    }

    .mt3-lead {
      font-size: 0.9375rem;
    }
  }

  /* W2 — animasyon, mobil, erisilebilirlik */
  @keyframes modulexW2Enter {
    from { opacity: 0.98; }
    to { opacity: 1; }
  }

  [class*="modulex"] {
    box-sizing: border-box;
    animation: modulexW2Enter 0.3s ease;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  a, button, [role="button"], input[type="submit"], input[type="button"] {
    cursor: pointer;
  }

  @media (max-width: 768px) {
    [class*="modulex"] {
      max-width: 100%;
      overflow-x: hidden;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    [class*="modulex"] {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
